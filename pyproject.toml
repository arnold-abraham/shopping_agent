[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-agent"
version = "0.1.0"
description = "AI shopping assistant built with LangChain, GPT-4o, and Streamlit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arnold Abraham" }]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "streamlit>=1.66,<2",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.17",
    "pre-commit>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Seed data tables are kept column-aligned for readability.
"src/shopping_agent/db.py" = ["E501"]
